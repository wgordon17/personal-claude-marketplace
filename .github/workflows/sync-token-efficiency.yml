name: Sync Token Efficiency Ruleset

on:
  schedule:
    - cron: '15 8 * * 1'  # Weekly, Monday 08:15 UTC (offset from sync-drawio-skill's 08:00 slot)
  workflow_dispatch:  # Manual trigger for testing

permissions: {}

concurrency:
  group: sync-token-efficiency
  cancel-in-progress: true

jobs:
  sync:
    name: Sync upstream token-efficiency ruleset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6

      - name: Verify upstream repository owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(gh api repos/JetBrains/benjamin-plus-skill --jq '.owner.login')
          if [[ "$OWNER" != "JetBrains" ]]; then
            echo "::error::Upstream repo owner resolved to '$OWNER', expected 'JetBrains' -- refusing to fetch (fetch URL may have been repointed)"
            exit 1
          fi

      - name: Resolve path-scoped upstream commit SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHA=$(gh api "repos/JetBrains/benjamin-plus-skill/commits?path=injected-instruction.md&sha=main&per_page=1" --jq '.[0].sha')
          if ! [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not extract a valid commit SHA scoped to injected-instruction.md"
            exit 1
          fi
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream file, strip header, and run safety checks
        env:
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          curl -sfL \
            "https://raw.githubusercontent.com/JetBrains/benjamin-plus-skill/${UPSTREAM_SHA}/injected-instruction.md" \
            -o "$RUNNER_TEMP/upstream-raw.md"
          test -s "$RUNNER_TEMP/upstream-raw.md" || { echo "::error::injected-instruction.md fetch failed or empty"; exit 1; }

          # injected-instruction.md ships without YAML frontmatter: it opens with
          # "BENJAMIN-PLUS MODE ACTIVE" followed by one blank line, then
          # "# Benjamin-Plus". Strip that header (the first two lines). Internal
          # CI script use of head/tail/cat/sed is fine here -- the blocked-tool
          # constraint applies to token-efficiency.md's rendered content, which a
          # Claude Code session reads as instructions, not to this CI script.
          tail -n +3 "$RUNNER_TEMP/upstream-raw.md" > "$RUNNER_TEMP/upstream-stripped.md"

          if ! head -n 1 "$RUNNER_TEMP/upstream-stripped.md" | grep -qx '# Benjamin-Plus'; then
            echo "::error::Stripped content does not start with '# Benjamin-Plus' -- upstream header format may have changed"
            exit 1
          fi
          if grep -q 'BENJAMIN-PLUS MODE ACTIVE' "$RUNNER_TEMP/upstream-stripped.md"; then
            echo "::error::Stripped content still contains 'BENJAMIN-PLUS MODE ACTIVE' -- header strip may have duplicated or missed a line"
            exit 1
          fi

          # Trojan-Source-style rendering-attack guard (CVE-2021-42574 pattern):
          # bidi-control and zero-width/invisible characters would not visibly
          # surface in GitHub's diff view, the sole human review gate for this
          # imperative-instruction content.
          if grep -P '[\x{202A}-\x{202E}\x{2066}-\x{2069}\x{200B}-\x{200D}\x{FEFF}]' "$RUNNER_TEMP/upstream-stripped.md"; then
            echo "::error::Fetched content contains Unicode bidi-control or zero-width characters -- refusing to sync"
            exit 1
          fi

      - name: Prepend attribution comment
        env:
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            cat <<EOF
          <!-- Vendored from https://github.com/JetBrains/benjamin-plus-skill (MIT) at commit ${UPSTREAM_SHA}. See UPSTREAM.md in this directory's parent, and token-efficiency.LICENSE alongside this file, for attribution and sync details. Rules 1-3's examples are locally patched on every sync to avoid recommending shell tools this repo's own dev-guard/hooks/tool-selection-guard.py blocks (head, tail, cat, bare python) in favor of the Read tool / uv run — see .github/scripts/patch-token-efficiency.sh. -->

          EOF
            cat "$RUNNER_TEMP/upstream-stripped.md"
          } > "$RUNNER_TEMP/upstream-patched.md"

      - name: Apply blocked-tool-avoidance patch
        run: bash .github/scripts/patch-token-efficiency.sh "$RUNNER_TEMP/upstream-patched.md"

      - name: Check for changes
        id: diff
        run: |
          OLD_SHA=$(grep -oP '(?<=\*\*Vendored SHA\*\* \| `)[0-9a-f]{40}' dev-guard/UPSTREAM.md)
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"

          changed=false
          diff -q "$RUNNER_TEMP/upstream-patched.md" dev-guard/references/token-efficiency.md > /dev/null 2>&1 || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check rule-count drift
        id: ruledrift
        if: steps.diff.outputs.changed == 'true'
        run: |
          OLD_COUNT=$(grep -c '^\*\*[0-9]\+\.' dev-guard/references/token-efficiency.md || true)
          NEW_COUNT=$(grep -c '^\*\*[0-9]\+\.' "$RUNNER_TEMP/upstream-patched.md" || true)
          echo "old_count=$OLD_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          if [[ "$OLD_COUNT" != "$NEW_COUNT" ]]; then
            echo "rule_count_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rule_count_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce size ceiling
        if: steps.diff.outputs.changed == 'true'
        run: |
          OLD_SIZE=$(wc -c < dev-guard/references/token-efficiency.md)
          NEW_SIZE=$(wc -c < "$RUNNER_TEMP/upstream-patched.md")
          LIMIT=$((OLD_SIZE * 2))
          if (( NEW_SIZE > LIMIT )); then
            echo "::error::New content size (${NEW_SIZE} bytes) exceeds 2x the current vendored file size (${OLD_SIZE} bytes, limit ${LIMIT}) -- refusing to sync"
            exit 1
          fi

      - name: Write vendored file and bump versions
        if: steps.diff.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          cp "$RUNNER_TEMP/upstream-patched.md" dev-guard/references/token-efficiency.md

          TODAY=$(date -u +%Y-%m-%d)
          UPSTREAM_SHA="$UPSTREAM_SHA" TODAY="$TODAY" perl -0777 -i -pe '
            s/\| \*\*Vendored SHA\*\* \| `[0-9a-f]{40}` \|/| **Vendored SHA** | `$ENV{UPSTREAM_SHA}` |/;
            s/\| \*\*Last synced\*\* \| `[0-9]{4}-[0-9]{2}-[0-9]{2}` \|/| **Last synced** | `$ENV{TODAY}` |/;
          ' dev-guard/UPSTREAM.md

          jq '.version |= (split(".") | .[2] |= (tonumber + 1 | tostring) | join("."))' \
            dev-guard/.claude-plugin/plugin.json > "$RUNNER_TEMP/plugin.json"
          mv "$RUNNER_TEMP/plugin.json" dev-guard/.claude-plugin/plugin.json

          jq '(.plugins[] | select(.name == "dev-guard")).version |= (split(".") | .[2] |= (tonumber + 1 | tostring) | join("."))' \
            .claude-plugin/marketplace.json > "$RUNNER_TEMP/marketplace.json"
          mv "$RUNNER_TEMP/marketplace.json" .claude-plugin/marketplace.json

      - name: Construct PR body
        if: steps.diff.outputs.changed == 'true'
        id: prbody
        env:
          OLD_SHA: ${{ steps.diff.outputs.old_sha }}
          NEW_SHA: ${{ steps.resolve.outputs.sha }}
          RULE_COUNT_CHANGED: ${{ steps.ruledrift.outputs.rule_count_changed }}
          OLD_RULE_COUNT: ${{ steps.ruledrift.outputs.old_count }}
          NEW_RULE_COUNT: ${{ steps.ruledrift.outputs.new_count }}
        run: |
          NEW_VERSION=$(jq -r '.version' dev-guard/.claude-plugin/plugin.json)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          {
            cat <<EOF
          ## Summary
          - Syncs the vendored token-efficiency ruleset from [JetBrains/benjamin-plus-skill](https://github.com/JetBrains/benjamin-plus-skill) (\`injected-instruction.md\`)
          - Auto-bumps dev-guard plugin version to ${NEW_VERSION}
          - Compare upstream changes: https://github.com/JetBrains/benjamin-plus-skill/compare/${OLD_SHA}...${NEW_SHA}
          EOF

            if [[ "$RULE_COUNT_CHANGED" == "true" ]]; then
              cat <<EOF

          **Rule count changed:** ${OLD_RULE_COUNT} -> ${NEW_RULE_COUNT} -- review carefully, upstream may have added or removed a rule category.
          EOF
            fi

            cat <<'EOF'

          ## Injection review checklist
          - [ ] Does the diff instruct running any command, fetching, or writing to any destination?
          - [ ] Does it introduce a new URL or domain?
          - [ ] Does it contain override/safety-bypass phrasing (e.g. "ignore previous instructions," "always approve," "skip confirmation")?
          - [ ] Does it add a new imperative rule beyond the five existing categories?
          - [ ] Does the diff change the meaning or behavioral guidance of any of the five existing rule categories (e.g., softening a verification requirement, shortening a recommended wait interval, weakening a stated invariant) even without adding new text?
          EOF
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create branch and commit
        if: steps.diff.outputs.changed == 'true'
        id: branch
        env:
          NEW_VERSION: ${{ steps.prbody.outputs.new_version }}
        run: |
          BRANCH="chore/sync-token-efficiency-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add dev-guard/references/token-efficiency.md dev-guard/UPSTREAM.md \
            dev-guard/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(dev-guard): syncs upstream token-efficiency ruleset to v${NEW_VERSION}"
          git push origin "$BRANCH"

      - name: Create draft PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          NEW_VERSION: ${{ steps.prbody.outputs.new_version }}
        run: |
          gh pr create --head "$BRANCH" --base main --draft \
            --title "chore(dev-guard): syncs upstream token-efficiency ruleset to v${NEW_VERSION}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
