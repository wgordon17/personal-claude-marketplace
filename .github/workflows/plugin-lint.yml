name: Plugin Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '**.json'
      - '**.md'
      - '**.sh'
      - '**.yaml'
      - '**.yml'
      - '**.py'
      - '**.ts'
      - '**/.mcp.json'
      - '**/mcp.json'
      - '**/hooks.json'
      - '**/plugin.json'
      - '**/SKILL.md'
      - '.agents/**'
      - '.skillsaw.yaml'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-lint:
    name: Plugin Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: git fetch origin main
      - run: uvx skillsaw@0.22.0 lint --strict --no-plugins

      - name: No README in skill directories
        run: |
          files=$(find . -path '*/skills/*/README.md' -not -path './.claude/*')
          if [ -n "$files" ]; then
            echo "::error::README.md found in skill directories (use SKILL.md instead):"
            echo "$files"
            exit 1
          fi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Run ShellCheck on repository shell scripts
        run: |
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck "${files[@]}"

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a  # v1.73.2
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: error

  eval-coverage-check:
    name: Skill Eval Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv python install 3.13
      - run: git fetch origin main
      # Non-blocking by design (see skill_eval/cli.py _mode_coverage_check) —
      # no AI credentials available in CI, this only flags a diff-coverage
      # gap for a human to review, it never fails the job.
      - run: make eval-coverage-check

  markdown-link-check:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Verify Local Markdown Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '**/*.md'
          fail: true
