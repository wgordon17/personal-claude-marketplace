[project]
name = "skill-eval"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
    "deepeval==3.9.7",
    "instructor==1.12.0",
    "anthropic[vertex]==2.7.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-xdist==3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
